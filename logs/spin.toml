#:schema https://schemas.spinframework.dev/spin/manifest-v2/latest.json

spin_manifest_version = 2

[application]
name = "logs"
version = "0.1.0"
authors = ["Kate Goldenring <kgoldenr@akamai.com>"]
description = "App that configurably logs"

[[trigger.http]]
route = "/..."
component = "logs"

[component.logs]
source = "target/wasm32-wasip2/release/logs.wasm"
allowed_outbound_hosts = []
[component.logs.build]
command = "cargo build --target wasm32-wasip2 --release"
watch = ["src/**/*.rs", "Cargo.toml"]
